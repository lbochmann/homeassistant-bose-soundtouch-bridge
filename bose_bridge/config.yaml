name: "Bose SoundTouch Bridge"
description: "Revives preset buttons on Bose SoundTouch speakers after the Bose cloud retirement (2026). Manages every SoundTouch on the LAN from one instance — same presets on every speaker by default; add `speakers:` entries to override individual speakers."
version: "1.9.1"
slug: "bose_bridge"
url: "https://github.com/lbochmann/homeassistant-bose-soundtouch-bridge"
init: false
arch:
  - amd64
  - aarch64
boot: auto
startup: services
host_network: true
ingress: true
ingress_port: 9002
services:
  - mqtt:need
options:
  preset_1_url: ""
  preset_2_url: ""
  preset_3_url: ""
  preset_4_url: ""
  preset_5_url: ""
  preset_6_url: ""
  speakers: []
  sync_presets_on_startup: true
  https_proxy: false
  proxy_port: 9000
schema:
  preset_1_url: str?
  preset_2_url: str?
  preset_3_url: str?
  preset_4_url: str?
  preset_5_url: str?
  preset_6_url: str?
  speakers:
    - name: str?
      host: str?
      preset_1_url: str?
      preset_2_url: str?
      preset_3_url: str?
      preset_4_url: str?
      preset_5_url: str?
      preset_6_url: str?
  sync_presets_on_startup: bool
  https_proxy: bool
  proxy_port: int
