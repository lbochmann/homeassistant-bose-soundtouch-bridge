name: "Bose SoundTouch Bridge"
description: "Revives preset buttons on Bose SoundTouch speakers after the Bose cloud retirement (2026). Manages every SoundTouch on the LAN from one instance — each speaker can have its own preset map, or share a default."
version: "1.6.0"
slug: "bose_bridge"
url: "https://github.com/lbochmann/homeassistant-bose-soundtouch-bridge"
init: false
arch:
  - amd64
  - aarch64
boot: auto
startup: services
host_network: true
services:
  - mqtt:need
options:
  sync_presets_on_startup: true
  speakers: []
schema:
  sync_presets_on_startup: bool
  speakers:
    - name: str?
      host: str?
      preset_1_url: str?
      preset_2_url: str?
      preset_3_url: str?
      preset_4_url: str?
      preset_5_url: str?
      preset_6_url: str?
