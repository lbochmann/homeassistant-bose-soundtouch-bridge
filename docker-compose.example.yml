# Example docker-compose for Home Assistant Container / plain Docker / NAS.
# Inside HAOS / Supervised, install the add-on from the App Store instead.
#
# Save as `docker-compose.yml`, edit the values for your setup, then:
#   docker compose up -d
#
# host networking is required so the bridge can:
#   - receive SSDP multicast for auto-discovery
#   - reach each speaker's UPnP port (8091) and WebSocket (8080)
#   - talk to your local MQTT broker

services:
  bose_bridge:
    image: ghcr.io/lbochmann/bose-soundtouch-bridge:latest
    container_name: bose-soundtouch-bridge
    network_mode: host
    restart: unless-stopped
    environment:
      # JSON array of speakers. Each entry is one of:
      #   - {"preset_N_url": "..."}                                wildcard — applies to every
      #                                                            SoundTouch on the LAN that no
      #                                                            other entry claims
      #   - {"name": "Wohnzimmer", "preset_N_url": "..."}          matched by the friendly name
      #                                                            set on the speaker (SSDP,
      #                                                            survives DHCP changes)
      #   - {"host": "192.168.1.42", "preset_N_url": "..."}        pinned to a fixed IP
      SPEAKERS_JSON: |
        [
          {
            "name": "Wohnzimmer",
            "preset_1_url": "http://icecast.vrtcdn.be/radio1-high.mp3",
            "preset_2_url": "http://icecast.vrtcdn.be/stubru-high.mp3"
          },
          {
            "name": "Bad",
            "preset_1_url": "http://icecast.vrtcdn.be/ra2ovl-high.mp3"
          }
        ]

      # Seed each speaker's preset slots on startup so physical button presses
      # always fire the WebSocket event. Skips slots already in the right state.
      SYNC_PRESETS_ON_STARTUP: "true"

      # MQTT — optional. If set, the bridge publishes HA discovery configs and
      # six `button.bose_<id>_preset_N` entities auto-appear per speaker.
      # Leave MQTT_HOST blank to skip MQTT entirely.
      MQTT_HOST: ""           # e.g. "192.168.1.10" or "mosquitto"
      MQTT_PORT: "1883"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
